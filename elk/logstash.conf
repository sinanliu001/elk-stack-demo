input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Normalise types from JSON (numbers sometimes arrive as strings)
  if [statusCode] {
    mutate {
      convert => { "statusCode" => "integer" }
    }
  }

  mutate {
    add_field => { "service" => "mock-api" }
  }
}

output {
  elasticsearch {
    # Same Docker network as Elasticsearch (see docker-compose.yml)
    hosts => ["http://elasticsearch:9200"]
    index => "node-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
  stdout { codec => rubydebug }
}
