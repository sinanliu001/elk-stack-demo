services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: install composable index template before Logstash creates indices
  es-templates:
    image: curlimages/curl:8.11.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./templates/node-logs-index-template.json:/template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'curl -sS -f -X PUT "http://elasticsearch:9200/_index_template/node-logs" -H "Content-Type: application/json" --data-binary @/template.json'

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    environment:
      - xpack.monitoring.enabled=false
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-templates:
        condition: service_completed_successfully
